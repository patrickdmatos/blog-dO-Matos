name: Deploy (Cloudflare Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, dom
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Testes
        run: php artisan test

      - name: Gerar site estático
        run: php artisan blog:build --url="${{ vars.BLOG_URL || 'https://blog-do-matos.pages.dev' }}"
        env:
          BLOG_SHOW_DRAFTS: 'false'

      # Node 22 traz o npm 10, que roda os scripts de instalação do Wrangler
      # (esbuild/workerd). Versões novas do npm os bloqueiam e o Wrangler trava.
      - uses: actions/setup-node@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          node-version: '22'

      - name: Publicar no Cloudflare Pages
        # Só publica se os segredos estiverem configurados no repositório.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        timeout-minutes: 5
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'blog-do-matos' }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT_NAME" --branch="$BRANCH"
